[project]
name = "fin-edgar-mcp-server"
version = "0.1.0"
authors = [{ name = "fin-edgar-mcp-server authors" }]
description = "MCP server for SEC EDGAR filings, XBRL financials and FRED macro data, with caching, rate limiting and read-only SQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["mcp", "sec", "edgar", "fred", "xbrl", "finance", "fastmcp"]
dependencies = [
    "fastmcp>=4.2,<5",
    "httpx>=0.27",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "sqlglot>=25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
fin-edgar-mcp = "fin_edgar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_edgar_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the real SEC and FRED APIs (needs network, EDGAR_USER_AGENT and FRED_API_KEY)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.coverage.run]
source = ["fin_edgar_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff.lint.per-file-ignores]
"tests/factories.py" = ["E501"]
